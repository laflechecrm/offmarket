services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-offmarket}
      POSTGRES_USER: ${POSTGRES_USER:-offmarket}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-offmarket}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-offmarket}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-offmarket}:${POSTGRES_PASSWORD:-offmarket}@db:5432/${POSTGRES_DB:-offmarket}
      SIRENE_DATA_DIR: /data/sirene
    volumes:
      - ./backend:/app
      - sirene_data:/data/sirene
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  frontend:
    build: ./frontend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

  # One-shot pipeline service (docker compose run pipeline)
  # Runs the full enrichment pipeline and exits.
  pipeline:
    build: ./backend
    restart: "no"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-offmarket}:${POSTGRES_PASSWORD:-offmarket}@db:5432/${POSTGRES_DB:-offmarket}
      SIRENE_DATA_DIR: /data/sirene
    volumes:
      - ./backend:/app
      - sirene_data:/data/sirene
    depends_on:
      backend:
        condition: service_healthy
    profiles:
      - pipeline
    command: >
      python -m app.pipeline.run_all
      ${PIPELINE_FLAGS:---download}

volumes:
  postgres_data:
  sirene_data:
